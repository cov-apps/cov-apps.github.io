name: 버그 신고
description: 앱에서 발생한 문제를 제보합니다.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        오류 제보 감사합니다. 공개 이슈에는 이메일, 비밀번호, IP 카메라 접속 주소, 토큰 등 개인·민감 정보를 올리지 마세요.
  - type: input
    id: app
    attributes:
      label: 앱 이름
      placeholder: "예: Tiny IP Camera"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱 버전
      placeholder: "예: 1.0.0"
  - type: input
    id: device
    attributes:
      label: 기기 / Android 버전
      placeholder: "예: Galaxy S23 / Android 16"
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 발생할 때까지의 조작 순서를 순서대로 적어주세요.
      placeholder: "1. 앱 실행\n2. 메뉴 선택\n3. 오류 발생"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      placeholder: 정상일 때 기대한 결과를 적어 주세요.
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제 나타난 오류, 메시지, 발생 빈도를 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 보호 확인
      options:
        - label: 공개 이슈에 개인정보, 비밀번호, 민감한 네트워크 정보를 포함하지 않았습니다.
          required: true
